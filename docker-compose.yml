# 本地预览：docker compose up --build web        （默认端口 5173）
# 指定端口：WEB_PORT=8080 docker compose up --build web
# 一次性验收：docker compose up --build --exit-code-from verify verify
services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  verify:
    build:
      context: .
      target: verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:5173
